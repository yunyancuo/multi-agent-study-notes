<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" height="auto" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1080" height="410" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="540" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">图 6：多智能体上下文工程（全量广播污染 vs. 沙箱隔离与 Typed State Reducer）</text>

  <!-- Left: Anti-Pattern -->
  <rect x="28" y="58" width="500" height="326" rx="10" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
  <text x="278" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#9F1239">1. 反模式：全量对话历史广播拼接 (Chat History Append)</text>

  <rect x="48" y="104" width="460" height="118" rx="6" fill="#FFFFFF" stroke="#FECDD3"/>
  <text x="64" y="128" font-size="12" font-weight="bold" fill="#B91C1C">第 4 棒 Agent 实际收到的 Prompt 窗口（信噪比 &lt; 15%）：</text>
  <rect x="64" y="138" width="428" height="20" rx="3" fill="#FEE2E2"/><text x="72" y="152" font-size="10" fill="#991B1B">[Agent 1 原始 JSON 报错 + 3 次重试废话 + 冗长网页源码 18,000 tokens]</text>
  <rect x="64" y="162" width="428" height="20" rx="3" fill="#FEE2E2"/><text x="72" y="176" font-size="10" fill="#991B1B">[Agent 2 中间思考草稿 + 被推翻的错误假设 12,000 tokens]</text>
  <rect x="64" y="186" width="428" height="20" rx="3" fill="#FEF3C7"/><text x="72" y="200" font-size="10" fill="#92400E">[真正需要传给 Agent 4 的有效输入参数：仅 300 tokens]</text>

  <rect x="48" y="236" width="460" height="130" rx="6" fill="#FFFFFF" stroke="#FECDD3"/>
  <text x="64" y="258" font-size="12" font-weight="bold" fill="#9F1239">三大工程灾难：</text>
  <text x="64" y="280" font-size="11" fill="#334155">• 幻觉锚定传染：前序 Agent 已经被推翻的错误猜想留在历史里，被后续 Agent 当真</text>
  <text x="64" y="302" font-size="11" fill="#334155">• 角色边界溶解：看多了其他角色的说话风格与工具调用后，当前 Agent 忘记自身职责</text>
  <text x="64" y="324" font-size="11" fill="#334155">• 平方级成本爆炸：N 个 Agent 轮流发言 K 轮，总输入 Token 按 O(K²N²) 增长</text>
  <text x="64" y="346" font-size="11" fill="#B91C1C" font-weight="bold">• 实测数据：超过 32k 混杂历史后，工具参数遵循准确率平均下降 28%~41%</text>

  <!-- Right: Best Practice -->
  <rect x="556" y="58" width="496" height="326" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="804" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#065F46">2. 标准范式：子空间沙箱隔离 + 结构化状态归约 (State Reducer)</text>

  <rect x="576" y="104" width="456" height="118" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="592" y="128" font-size="12" font-weight="bold" fill="#047857">基于作用域切片 (Scoped View) 与 Pydantic 契约的状态流转：</text>
  <rect x="592" y="140" width="126" height="64" rx="5" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="655" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">Subagent 沙箱</text>
  <text x="655" y="180" text-anchor="middle" font-size="10" fill="#334155">内部消耗 20k tokens</text>
  <text x="655" y="196" text-anchor="middle" font-size="10" fill="#15803D">外部不可见</text>
  <text x="742" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">→ Schema 校验 →</text>
  <rect x="768" y="140" width="246" height="64" rx="5" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="891" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803D">Global Typed State (Blackboard)</text>
  <text x="891" y="180" text-anchor="middle" font-size="10" fill="#334155">只写入通过校验的 200 tokens 结构化字段</text>
  <text x="891" y="196" text-anchor="middle" font-size="10" fill="#334155">原始长日志落盘 Blob，仅存 URI 引用</text>

  <rect x="576" y="236" width="456" height="130" rx="6" fill="#FFFFFF" stroke="#A7F3D0"/>
  <text x="592" y="258" font-size="12" font-weight="bold" fill="#065F46">四大上下文治理守则：</text>
  <text x="592" y="280" font-size="11" fill="#334155">1. 最小权限视图 (Least-Privilege Projection)：每个节点只读取自身 Schema 声明的字段</text>
  <text x="592" y="302" font-size="11" fill="#334155">2. 传引用不传大对象 (Claim-Check Pattern)：大图表/长文档存外部存储，状态只传指针</text>
  <text x="592" y="324" font-size="11" fill="#334155">3. 确定性归约器 (Deterministic Reducer)：并发节点写同一状态键时用显式合并函数防覆盖</text>
  <text x="592" y="346" font-size="11" fill="#047857" font-weight="bold">4. 失败草稿清零：子 Agent 重试前的错误轨迹严禁带入下一棒 Agent 的上下文</text>
</svg>